services:
  shade-agent-app:
    environment:
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      DEMO_MODE: ${DEMO_MODE}
      NEARAI_API_KEY: ${NEARAI_API_KEY}
      NEARAI_MODEL: ${NEARAI_MODEL}
      DEMO_FAUCET_ETH_KEY: ${DEMO_FAUCET_ETH_KEY}
      DEMO_FAUCET_BTC_KEY: ${DEMO_FAUCET_BTC_KEY}
      NEAR_RPC_URL: ${NEAR_RPC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    platform: linux/amd64
    # Pinned by digest: the compose hash (and so the approved measurements) covers this line
    image: unwizarding/inheirit-agent@sha256:373dfdb008f9a80752a3272581507a3716141e53d6c6df581cd0dd67c3baec9a
    container_name: shade-agent-app
    ports:
      - 3000:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      # Executor state (pending signed txs, snapshots) must survive restarts so retries never double-send
      - agent-data:/app/data
    restart: always

volumes:
  agent-data:
